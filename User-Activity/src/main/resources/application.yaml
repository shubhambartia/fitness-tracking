server:
  port: 8081

spring:
  application:
    name: User-Activity

  mongodb:
    uri: mongodb://localhost:27017/user-activity
    database: fitness-activity
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

rabbitmq:
  exchange:
    name: fitness.exchange
  queue:
    name: activity.queue
  routing:
    key: tracking



