server:
  port: 8082

spring:
  application:
    name: Activity-service

  mongodb:
    uri: mongodb://localhost:27017/user-activity
    database: fitness-activity
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

rabbitmq:
  exchange:
    name: fitness.exchange
  queue:
    name: activity.queue
  routing:
    key: tracking



