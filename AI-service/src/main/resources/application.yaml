spring:
  application:
    name: AI-service
  config:
    import:
      - optional:configserver:http://localhost:8888

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

gemini:
  api:
    api-key: {GEMINI_API_KEY}