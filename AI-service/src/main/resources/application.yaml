server:
  port: 8082

spring:
  application:
    name: AI-service

  mongodb:
      uri: mongodb://localhost:27017/fitness-activity

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true